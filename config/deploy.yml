service: lawrelay

# Required when invoking Kamal. Keeping these values out of this file prevents
# accidental deployment to the wrong host or registry.
image: <%= ENV.fetch("KAMAL_IMAGE") %>

servers:
  web:
    - <%= ENV.fetch("LAWRELAY_SERVER_IP") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST", "lawrelay.be") %>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    APP_HOST: <%= ENV.fetch("APP_HOST", "lawrelay.be") %>
    APP_PROTOCOL: https
    ADDITIONAL_HOSTS: <%= ENV.fetch("ADDITIONAL_HOSTS", "www.lawrelay.be") %>
    ASSUME_SSL: true
    FORCE_SSL: true
    ACTIVE_STORAGE_SERVICE: local
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "smtp.migadu.com") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    SMTP_DOMAIN: <%= ENV.fetch("SMTP_DOMAIN", ENV.fetch("APP_HOST", "lawrelay.be")) %>
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM", "LawRelay <no-reply@lawrelay.be>") %>
    SMTP_AUTHENTICATION: <%= ENV.fetch("SMTP_AUTHENTICATION", "plain") %>
    SMTP_SSL: <%= ENV.fetch("SMTP_SSL", "false") %>
    SMTP_STARTTLS: <%= ENV.fetch("SMTP_STARTTLS", "true") %>
    LAWRELAY_LEGAL_NAME: <%= ENV.fetch("LAWRELAY_LEGAL_NAME", "Gauthier Berth") %>
    LAWRELAY_REGISTERED_ADDRESS: <%= ENV.fetch("LAWRELAY_REGISTERED_ADDRESS", "Koningin Astridlaan 210 bus A, 9000 Gent, Belgium") %>
    LAWRELAY_ENTERPRISE_NUMBER: <%= ENV.fetch("LAWRELAY_ENTERPRISE_NUMBER", "0781.961.243") %>
    LAWRELAY_VAT_NUMBER: <%= ENV.fetch("LAWRELAY_VAT_NUMBER", "BE0781.961.243") %>
    LAWRELAY_LEGAL_EMAIL: <%= ENV.fetch("LAWRELAY_LEGAL_EMAIL", "info@lawrelay.be") %>
    LAWRELAY_PRIVACY_EMAIL: <%= ENV.fetch("LAWRELAY_PRIVACY_EMAIL", "privacy@lawrelay.be") %>
    LAWRELAY_SUPPORT_EMAIL: <%= ENV.fetch("LAWRELAY_SUPPORT_EMAIL", "support@lawrelay.be") %>
    LAWRELAY_PHONE: <%= ENV.fetch("LAWRELAY_PHONE", "+32 474 78 09 57") %>
    LAWRELAY_PROFESSIONAL_BODY: <%= ENV.fetch("LAWRELAY_PROFESSIONAL_BODY", "Balie Brussel (Nederlandse Orde)") %>
    LAWRELAY_PROFESSIONAL_RULES_URL: <%= ENV.fetch("LAWRELAY_PROFESSIONAL_RULES_URL", "https://www.ordevanvlaamsebalies.be/nl/kennisbank/deontologie/codex-deontologie-voor-advocaten") %>
    LAWRELAY_BILLING_ENFORCED: <%= ENV.fetch("LAWRELAY_BILLING_ENFORCED", "true") %>
    LAWRELAY_RELEASE_MODE: <%= ENV.fetch("LAWRELAY_RELEASE_MODE", "beta") %>
    RAILS_LOG_LEVEL: info
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite, Active Storage, Solid Cache, Solid Queue, and Solid Cable live here.
# Production deployment is blocked until the off-host backup job in
# docs/ops/backup-restore.md is installed and a restore drill has passed.
volumes:
  - "lawrelay_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "deploy") %>

retain_containers: 5
