en:
  number:
    format:
      separator: "."
      delimiter: ","
  date:
    formats:
      default: "%Y-%m-%d"
      short: "%b %-d"
      long: "%B %-d, %Y"
    day_names: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    abbr_day_names: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
    month_names: [~, January, February, March, April, May, June, July, August, September, October, November, December]
    abbr_month_names: [~, Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
    order: [year, month, day]
  time:
    formats:
      default: "%A, %B %-d, %Y %H:%M"
      short: "%b %-d, %H:%M"
      long: "%A, %B %-d, %Y %H:%M"
    am: "am"
    pm: "pm"
  errors:
    format: "%{attribute} %{message}"
    messages:
      password_too_long: "is too long; choose a shorter password"
      accepted: "must be accepted"
      blank: "can't be blank"
      confirmation: "doesn't match %{attribute}"
      empty: "can't be empty"
      equal_to: "must be equal to %{count}"
      even: "must be even"
      exclusion: "is reserved"
      greater_than: "must be greater than %{count}"
      greater_than_or_equal_to: "must be greater than or equal to %{count}"
      inclusion: "is not included in the list"
      invalid: "is invalid"
      less_than: "must be less than %{count}"
      less_than_or_equal_to: "must be less than or equal to %{count}"
      model_invalid: "Validation failed: %{errors}"
      record_invalid: "Validation failed: %{errors}"
      not_a_number: "is not a number"
      not_an_integer: "must be an integer"
      odd: "must be odd"
      other_than: "must be other than %{count}"
      present: "must be blank"
      required: "must exist"
      taken: "has already been taken"
      too_long:
        one: "is too long (maximum is 1 character)"
        other: "is too long (maximum is %{count} characters)"
      too_short:
        one: "is too short (minimum is 1 character)"
        other: "is too short (minimum is %{count} characters)"
      wrong_length:
        one: "is the wrong length (should be 1 character)"
        other: "is the wrong length (should be %{count} characters)"
  activerecord:
    models:
      user: "User"
      firm: "Company"
      lawyer_profile: "Lawyer profile"
      assignment: "Assignment"
      proposal: "Proposal"
      privacy_request: "Privacy request"
      report: "Report"
    attributes:
      user: &user_attributes
        first_name: "First name"
        last_name: "Last name"
        email_address: "Professional email"
        password: "Password"
        password_confirmation: "Password confirmation"
        locale: "Language"
        system_role: "System role"
        suspension_reason: "Suspension reason"
      firm: &firm_attributes
        name: "Company name"
        enterprise_number: "Enterprise number"
        vat_number: "VAT number"
        billing_email: "Billing email"
        phone: "Phone"
        address_line_1: "Address"
        postal_code: "Postal code"
        city: "City"
        country_code: "Country"
        verification_status: "Verification status"
      lawyer_profile: &profile_attributes
        bar_association: "Bar association"
        bar_number: "Bar number"
        bar_admission_year: "Year of admission"
        spoken_languages: "Spoken languages"
        practice_areas: "Practice areas"
        court_preferences: "Court preferences"
        availability_note: "Availability note"
        professional_email: "Professional email"
        directory_profile_url: "Directory profile URL"
        verification_status: "Verification status"
      assignment: &assignment_attributes
        kind: "Type"
        title: "Title"
        description: "Description"
        practice_area: "Practice area"
        starts_at: "Date and time"
        city: "City"
        court: "Court"
        duration_minutes: "Estimated duration"
        fee_cents: "Indicative fee"
        languages: "Languages"
        status: "Status"
        assignment_subtype: "Assignment subtype"
        response_deadline_at: "Response deadline"
        delivery_due_at: "Delivery due date"
        scope_indication: "Scope indication"
      proposal:
        name: "Name"
        email: "Email address"
        message: "Message"
        rate_cents: "Rate"
        rate_kind: "Rate type"
        status: "Status"
        user_id: "User"
      privacy_request:
        kind: "Request type"
        details: "Details"
        resolution_note: "Resolution note"
        status: "Status"
      report:
        category: "Category"
        details: "Details"
        resolution_note: "Resolution note"
        status: "Status"
        reportable_type: "Reported item type"
    errors:
      models:
        assignment:
          attributes:
            starts_at:
              in_future: "must be in the future"
            response_deadline_at:
              in_future: "must be in the future"
              before_start: "must be before the assignment starts"
            delivery_due_at:
              after_response: "must be after the response deadline"
              before_execution: "must be before the assignment starts"
