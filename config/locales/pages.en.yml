    pricing:
      meta_title: "Pricing — LawRelay"
      eyebrow: "beta"
      title: "Pricing"
      introduction: "For lawyers listed on advocaat.be, after verification."
      beta:
        kicker: "beta"
        price: "€0"
        title: "Free during the beta"
        body: "Post and respond to assignments. No payment details needed."
        features:
          - "Registration open to lawyers listed on advocaat.be"
          - "Directory check before marketplace access"
          - "Post and respond to professional assignments"
          - "Direct feedback to the LawRelay team"
      direct_fees:
        title: "Professional fees"
        body: "Agree your fee and invoice each other directly. LawRelay does not handle payments or take a commission."
      review_notice: "Beta access is free. LawRelay does not collect platform fees during this beta."
    privacy:
      meta_title: "Privacy notice — LawRelay"
      eyebrow: "privacy"
      title: "Privacy"
      introduction: "What data we use and why."
      operator_contact_heading: "Contact"
      sections:
        controller:
          heading: "1. Who controls your data"
          paragraphs:
            - "LawRelay's operator named above is the controller."
            - "Privacy questions and rights requests: privacy@lawrelay.be. We compare your name and professional email with advocaat.be and confirm your email. If you cannot access the listed address, an administrator can review another confirmed address using independent professional contact details."
        scope:
          heading: "2. Data we process"
          bullets:
            - "Account and contact data, including name, professional email, preferred language, and authentication records. Email-access requests, decisions and identity-check notes are kept with your professional profile."
            - "If you enable two-factor authentication, we store authenticator keys encrypted and recovery codes hashed."
            - "At your request, we fetch your public advocaat.be name, email, languages and legal areas to fill in signup. The preview is valid for 20 minutes."
            - "We check your advocaat.be profile and KBO enterprise number daily. The operator is alerted to an inactive business or a missing or changed profile."
            - "Professional and billing data: your official directory profile, listed name and email, company name, enterprise/VAT number, contact details and professional-verification status. If you use the official KBO public search to look up an enterprise number, we store the returned billing fields (name, number and, where available, registered-office address) and KBO source snapshot date."
            - "Professional profile and matching-preference data, including practice areas, court preferences, and—where relevant to legal tasks—spoken languages; also assignment, proposal, acceptance, cancellation, and audit-event data."
            - "Per-assignment invoice recipient data, including professional name and enterprise/VAT number. Verified assignment viewers can see the recipient name and number; the requester’s firm and the selected confrater can see the full invoice address and email."
            - "Support correspondence and technical/security data such as IP address, request identifiers, device information, and security events."
            - "For anonymous public visits only, cookieless Umami statistics: a limited page path, referrer origin and ordinary browser-request metadata. We do not send account details, private pages, forms, queries or assignment data."
            - "For anonymous visitors outside Belgium, a local security check uses the request IP to determine the country and stores a short-lived verification record."
          paragraphs:
            - "LawRelay is not intended to receive client names, case facts, pleadings, evidence, documents, or privileged communications. Users must keep that information in systems controlled by the lawyers involved."
        purposes:
          heading: "3. Why and on what basis"
          bullets:
            - "To create and secure accounts, verify eligibility, and provide matching features: performance of the service agreement."
            - "To prevent abuse, secure the service, support users, improve reliability, and establish or defend claims: legitimate interests, balanced against user rights."
            - "To understand use of public pages and improve the service: limited, cookieless aggregate analytics on the basis of our legitimate interests. You can turn statistics off in the footer. Do Not Track and Global Privacy Control are respected."
        sharing:
          heading: "4. Who receives data"
          paragraphs:
            - "Open assignments are visible to verified members. Proposals are visible to the submitting lawyer and the requester's firm. The requester and selected lawyer receive each other's email address after acceptance."
            - "The operator and the hosting, email and backup providers below process data as needed to run the service. Data is not sold."
        transfers:
          heading: "5. Location and transfers"
          paragraphs:
            - "Hetzner hosts the application in Germany. Encrypted backups are stored in AWS S3 Frankfurt. Migadu, a Swiss email provider, states that its email servers are located in France."
            - "Providers may also process account and support data outside the EEA. Switzerland has an EU adequacy decision; AWS's data-processing agreement includes standard contractual clauses where needed. Ask privacy@lawrelay.be for details or a copy of the safeguards."
        retention:
          heading: "6. Retention"
          paragraphs:
            - "The latest registry check stays with your account. Check summaries and resolved alerts: 90 days. Open alerts may remain for investigation."
            - "Unused, unconfirmed registrations: 30 days of inactivity. Public-page analytics: 90 days. Completed notifications: 90 days from creation; pending, failed or protected notifications may remain for investigation. Closed assignments and proposals: 2 years after closure. Resolved privacy requests and reports: 2 years after resolution. Resolved support conversations: 2 years after closure or the last reply, whichever is later. Audit logs: 1 year. Technical logs: up to 31 days."
            - "Accounts remain until closure. You can delete your account in Profile after confirming your password. We remove data that is no longer needed. Shared assignment data may remain pseudonymised for 2 years, alongside minimal deletion records. Open work, investigations, disputes or legal duties may require longer retention."
            - "Backups are kept for 30 days. Deleted data may temporarily remain in encrypted backups or storage versions, for up to about 60 days."
        rights:
          heading: "7. Your rights"
          paragraphs:
            - "Depending on the legal basis and circumstances, you may request access, correction, deletion, restriction or portability, or object to processing. Write to privacy@lawrelay.be. We normally reply within one month; if a lawful extension is needed, we tell you within that month."
            - "You may lodge a complaint with the Belgian Data Protection Authority. LawRelay may need to verify your identity before fulfilling a request."
        security:
          heading: "8. Security, incidents, and changes"
          paragraphs:
            - "LawRelay uses access controls, encryption in transit, secure authentication, logging controls, backups, monitoring and incident procedures. No online service can promise absolute security."
            - "Material changes will be dated and communicated through the service or by email where appropriate."
    terms:
      meta_title: "Terms of service — LawRelay"
      eyebrow: "terms of service"
      title: "Terms"
      introduction: "For the LawRelay beta."
      operator_contact_heading: "Operator"
      sections:
        agreement:
          heading: "1. Agreement and operator"
          paragraphs:
            - "The operator named above is your contracting party. You accept these terms when registering."
        eligibility:
          heading: "2. Eligibility and verification"
          paragraphs:
            - "Registration is open to lawyers listed on advocaat.be. Access requires directory and email verification. If the listed email is inaccessible, an administrator must review your identity and confirmed alternative address. Users keep professional details current, protect their credentials and report compromised access. Verification is not an endorsement or guarantee of competence."
        role:
          heading: "3. LawRelay's role"
          paragraphs:
            - "LawRelay lets you publish assignments and choose from the responses. The engagement is between the lawyers; LawRelay is not a party to it."
        professional_duties:
          heading: "4. Professional responsibility"
          bullets:
            - "Each lawyer remains responsible for authority to delegate, conflicts checks, independence, competence, deadlines, court rules, professional secrecy, insurance, client communication, and all bar obligations."
            - "A match or verification status never replaces the lawyer's own due diligence."
            - "Users must agree the scope, professional fee, invoicing, and practical arrangements directly."
        content:
          heading: "5. Assignments and prohibited content"
          paragraphs:
            - "Users may publish only accurate, necessary professional information and must have the right to share it. Client identities, case facts, documents, evidence, privileged communications, unlawful content, spam, discriminatory requests, and misleading listings are prohibited."
            - "LawRelay may remove, restrict, or preserve content where reasonably required for safety, compliance, disputes, or legal obligations."
        workflow:
          heading: "6. Responses and matches"
          paragraphs:
            - "The requester decides whom to contact or select. LawRelay does not guarantee a response, match, availability, outcome, quality, or payment by another user. Users must confirm every engagement and deadline outside the platform."
        beta_access:
          heading: "7. Beta"
          paragraphs:
            - "LawRelay is in beta. Features may change."
        professional_fees:
          heading: "8. Professional fees"
          paragraphs:
            - "Professional fees for an assignment are agreed, invoiced, and paid directly between the lawyers or firms. LawRelay does not hold those funds, deduct a commission, or guarantee payment."
        moderation:
          heading: "9. Reports, moderation, and suspension"
          paragraphs:
            - "Users may report unlawful, unsafe, or rule-breaking content to support@lawrelay.be. LawRelay may investigate, request information, restrict content, suspend access, or terminate an account proportionately."
            - "To contest a moderation decision, write to support@lawrelay.be with the account or assignment reference. LawRelay will review it and reply within a reasonable time."
        intellectual_property:
          heading: "10. Intellectual property"
          paragraphs:
            - "Users retain rights in private data and content they submit and grant LawRelay a limited licence to host, display, transmit, and process it only to operate and secure the service. The LawRelay software is available on GitHub under the GNU Affero General Public License, version 3 or later; that licence does not make users’ private data public. LawRelay retains rights in its brand."
        availability:
          heading: "11. Availability and changes"
          paragraphs:
            - "LawRelay may maintain, update, or change the service and does not promise uninterrupted availability. Material changes to the beta will be communicated reasonably in advance where practicable."
        liability:
          heading: "12. Liability, termination, and law"
          paragraphs:
            - "You may stop using the beta and delete your account in Profile after confirming your password. LawRelay may end beta access on reasonable notice or immediately where needed for security, law, or these terms."
            - "Belgian law governs these terms. Any mandatory rights that apply to you remain unaffected. Nothing in these terms excludes liability that cannot legally be excluded."
    cookies:
      meta_title: "Cookie notice — LawRelay"
      eyebrow: "cookies"
      title: "Cookies"
      introduction: "Only necessary cookies."
      sections:
        current_use:
          heading: "1. What is used today"
          paragraphs:
            - "Necessary signed session and form-security cookies keep you signed in and protect forms from forged requests. A login session lasts at most 30 days and ends earlier on logout, password reset, or session revocation. For an anonymous visitor outside Belgium, the security check uses a signed verification cookie for 24 hours and a return-path cookie for up to 10 minutes. The Statistics preference cookie remembers your setting for 180 days. A separate notice cookie remembers for 180 days that the information banner was closed. Umami itself uses no cookies."
        no_tracking:
          heading: "2. Public-page analytics"
          paragraphs:
            - "LawRelay uses self-hosted Umami for limited, cookieless aggregate statistics on anonymous public pages. It does not track advertising, profile visitors or record account pages, forms, page queries or assignment data. Use Statistics in the footer to turn statistics off or back on. Do Not Track and Global Privacy Control prevent statistics."
        retention:
          heading: "3. Duration and control"
          paragraphs:
            - "Session technology is limited to the duration and security needs of the service. You can remove cookies through browser settings, but blocking necessary cookies may prevent login or forms from working."
        future:
          heading: "4. If optional cookies are added"
          paragraphs:
            - "LawRelay will update this notice and request prior, granular consent before any non-essential cookie is used. Rejecting must be as easy as accepting, and consent must remain withdrawable."
        contact:
          heading: "5. Questions"
          paragraphs:
            - "Cookie and privacy questions can be sent to the privacy contact in the legal notice."
