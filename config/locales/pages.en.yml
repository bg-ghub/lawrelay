    privacy:
      meta_title: "Privacy notice — LawRelay"
      eyebrow: "privacy"
      title: "Privacy"
      introduction: "What data we use and why."
      operator_contact_heading: "Contact"
      sections:
        controller:
          heading: "1. Who controls your data"
          paragraphs:
            - "LawRelay's operator named above is the controller."
            - "Send privacy questions and rights requests to privacy@lawrelay.be. Registration checks use the public advocaat.be directory, automated comparison of the submitted information, and human review where needed; contact support@lawrelay.be if a check needs help."
        scope:
          heading: "2. Data we process"
          bullets:
            - "Account and contact data, including name, professional email, preferred language, and authentication records."
            - "Professional-verification data, including your official directory profile, listed name and professional email, firm details, and verification status."
            - "Professional profile and matching-preference data, including practice areas, court preferences, and—where relevant to legal tasks—spoken languages; also assignment, proposal, acceptance, cancellation, and audit-event data."
            - "Support correspondence and technical/security data such as IP address, request identifiers, device information, and security events."
          paragraphs:
            - "LawRelay is not intended to receive client names, case facts, pleadings, evidence, documents, or privileged communications. Users must keep that information in systems controlled by the lawyers involved."
        purposes:
          heading: "3. Why and on what basis"
          bullets:
            - "To create and secure accounts, verify eligibility, and provide matching features: performance of the service agreement."
            - "To prevent abuse, secure the service, support users, improve reliability, and establish or defend claims: legitimate interests, balanced against user rights."
            - "LawRelay does not use optional analytics."
        sharing:
          heading: "4. Who receives data"
          paragraphs:
            - "Data is shared only as required to operate the service: with the requesting or responding lawyer as the workflow requires, authorised LawRelay staff, and contracted hosting, transactional-email, security, and backup providers."
            - "Data is not sold."
        transfers:
          heading: "5. Location and transfers"
          paragraphs:
            - "Hetzner hosts the application in Germany. Encrypted backups are stored in AWS S3 Frankfurt. Migadu, a Swiss email provider, states that its email servers are located in France."
        retention:
          heading: "6. Retention"
          paragraphs:
            - "Account and marketplace data are kept while your account is active, then deleted on request unless professional, contractual, security, or legal obligations require a hold."
            - "Backups follow a 7 daily / 4 weekly / 12 monthly schedule. Rights requests are handled through a manual queue."
        rights:
          heading: "7. Your rights"
          paragraphs:
            - "Depending on the legal basis and circumstances, you may request access, correction, deletion, restriction, portability, or object to processing. You may withdraw consent without affecting earlier lawful processing."
            - "You may lodge a complaint with the Belgian Data Protection Authority. LawRelay may need to verify your identity before fulfilling a request."
        security:
          heading: "8. Security, incidents, and changes"
          paragraphs:
            - "LawRelay will use access controls, encryption in transit, secure authentication, logging controls, backups, monitoring, and incident procedures appropriate to the risk. No online service can promise absolute security."
            - "Material changes will be dated and communicated through the service or by email where appropriate."
    terms:
      meta_title: "Terms of service — LawRelay"
      eyebrow: "terms of service"
      title: "Terms"
      introduction: "For the free LawRelay beta."
      operator_contact_heading: "Operator"
      sections:
        agreement:
          heading: "1. Agreement and operator"
          paragraphs:
            - "The operator named above is your contracting party. You accept these terms when registering."
        eligibility:
          heading: "2. Eligibility and verification"
          paragraphs:
            - "Registration is open to lawyers listed on the official advocaat.be directory. Marketplace access follows a directory check. Users must provide accurate professional details, keep them current, protect their credentials, and promptly report compromised access. Verification does not constitute endorsement or a guarantee of competence."
        role:
          heading: "3. LawRelay's role"
          paragraphs:
            - "LawRelay provides software for publishing assignments, receiving responses, and coordinating an introduction between lawyers. It is not a law firm, employer, client, agent, escrow service, or party to the lawyer-to-lawyer engagement, and it does not provide legal advice."
        professional_duties:
          heading: "4. Professional responsibility"
          bullets:
            - "Each lawyer remains responsible for authority to delegate, conflicts checks, independence, competence, deadlines, court rules, professional secrecy, insurance, client communication, and all bar obligations."
            - "A match or verification status never replaces the lawyer's own due diligence."
            - "Users must agree the scope, professional fee, invoicing, and practical arrangements directly."
        content:
          heading: "5. Assignments and prohibited content"
          paragraphs:
            - "Users may publish only accurate, necessary professional information and must have the right to share it. Client identities, case facts, documents, evidence, privileged communications, unlawful content, spam, discriminatory requests, and misleading listings are prohibited."
            - "LawRelay may remove, restrict, or preserve content where reasonably required for safety, compliance, disputes, or legal obligations."
        workflow:
          heading: "6. Responses and matches"
          paragraphs:
            - "The requester decides whom to contact or select. LawRelay does not guarantee a response, match, availability, outcome, quality, or payment by another user. Users must confirm every engagement and deadline outside the platform."
        platform_fees:
          heading: "7. LawRelay fees and billing"
          paragraphs:
            - "Beta access is free. LawRelay does not offer paid subscriptions, collect platform fees, or ask for payment details during this beta."
            - "If LawRelay later offers paid access, the applicable price and terms will be published before any payment is requested."
        professional_fees:
          heading: "8. Professional fees"
          paragraphs:
            - "Professional fees for an assignment are agreed, invoiced, and paid directly between the lawyers or firms. LawRelay does not hold those funds, deduct a commission, or guarantee payment."
        moderation:
          heading: "9. Reports, moderation, and suspension"
          paragraphs:
            - "Users may report unlawful, unsafe, or rule-breaking content to support@lawrelay.be. LawRelay may investigate, request information, restrict content, suspend access, or terminate an account proportionately."
            - "If you disagree with a moderation decision, reply to the decision email or write to support@lawrelay.be with the relevant account and assignment reference. LawRelay will review the request and reply within a reasonable time."
        intellectual_property:
          heading: "10. Intellectual property"
          paragraphs:
            - "Users retain rights in private data and content they submit and grant LawRelay a limited licence to host, display, transmit, and process it only to operate and secure the service. The LawRelay software is available on GitHub under the GNU Affero General Public License, version 3 or later; that licence does not make users’ private data public. LawRelay retains rights in its brand."
        availability:
          heading: "11. Availability and changes"
          paragraphs:
            - "LawRelay may maintain, update, or change the service and does not promise uninterrupted availability. Material changes to the beta will be communicated reasonably in advance where practicable."
        liability:
          heading: "12. Liability, termination, and law"
          paragraphs:
            - "You may stop using the beta and request account deletion at any time by writing to support@lawrelay.be. LawRelay may end beta access on reasonable notice or immediately where needed for security, law, or these terms."
            - "Belgian law governs these terms. Any mandatory rights that apply to you remain unaffected. Nothing in these terms excludes liability that cannot legally be excluded."
    cookies:
      meta_title: "Cookie notice — LawRelay"
      eyebrow: "cookies"
      title: "Cookies"
      introduction: "Only necessary cookies."
      sections:
        current_use:
          heading: "1. What is used today"
          paragraphs:
            - "Necessary signed session and form-security cookies keep you signed in and protect forms from forged requests. A login session lasts at most 30 days and ends earlier on logout, password reset, or session revocation. These cookies are strictly necessary for the requested service."
        no_tracking:
          heading: "2. No optional tracking in the current release"
          paragraphs:
            - "LawRelay does not currently place advertising, behavioural-profiling, or optional analytics cookies. Language is carried in the page URL rather than a tracking cookie."
        retention:
          heading: "3. Duration and control"
          paragraphs:
            - "Session technology is limited to the duration and security needs of the service. You can remove cookies through browser settings, but blocking necessary cookies may prevent login or forms from working."
        future:
          heading: "4. If optional cookies are added"
          paragraphs:
            - "LawRelay will update this notice and request prior, granular consent before any non-essential cookie is used. Rejecting must be as easy as accepting, and consent must remain withdrawable."
        contact:
          heading: "5. Questions"
          paragraphs:
            - "Cookie and privacy questions can be sent to the privacy contact in the legal notice."
