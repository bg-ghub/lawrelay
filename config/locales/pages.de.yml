    privacy:
      meta_title: "Datenschutzhinweise — LawRelay"
      eyebrow: "Datenschutz"
      title: "Datenschutz"
      introduction: "Welche Daten wir nutzen und warum."
      operator_contact_heading: "Kontakt"
      sections:
        controller:
          heading: "1. Wer verantwortlich ist"
          paragraphs:
            - "Der oben genannte Betreiber von LawRelay ist Verantwortlicher."
            - "Senden Sie Datenschutzfragen und Betroffenenanträge an privacy@lawrelay.be. Bei Registrierungsprüfungen werden das öffentliche Verzeichnis von advocaat.be, ein automatischer Abgleich der angegebenen Informationen und bei Bedarf eine menschliche Prüfung verwendet; bei Unterstützungsbedarf schreiben Sie an support@lawrelay.be."
        scope:
          heading: "2. Welche Daten wir verarbeiten"
          bullets:
            - "Konto- und Kontaktdaten wie Name, berufliche E-Mail-Adresse, bevorzugte Sprache und Authentifizierungsdaten."
            - "Daten zur beruflichen Verifizierung: Ihr offizielles Verzeichnisprofil, der veröffentlichte Name und die berufliche E-Mail-Adresse, Kanzleiangaben und Prüfstatus."
            - "Daten zum beruflichen Profil und zu Vermittlungspräferenzen, einschließlich Rechtsgebieten, Gerichtspräferenzen und—soweit für juristische Aufgaben relevant—gesprochenen Sprachen; außerdem Auftrags-, Bewerbungs-, Annahme-, Stornierungs- und Auditdaten."
            - "Supportkommunikation und technische oder sicherheitsbezogene Daten wie IP-Adresse, Anfragekennung, Geräteinformation und Sicherheitsereignisse."
          paragraphs:
            - "LawRelay ist nicht für Mandantennamen, Sachverhalte, Schriftsätze, Beweismittel, Dokumente oder vertrauliche Kommunikation bestimmt. Diese Informationen müssen in Systemen unter Kontrolle der beteiligten Anwälte bleiben."
        purposes:
          heading: "3. Zwecke und Rechtsgrundlagen"
          bullets:
            - "Konten anlegen und sichern, Berechtigung prüfen und Vermittlungsfunktionen bereitstellen: Erfüllung des Dienstleistungsvertrags."
            - "Missbrauch verhindern, den Dienst sichern, Nutzer unterstützen, Zuverlässigkeit verbessern und Ansprüche begründen oder abwehren: berechtigte Interessen nach Abwägung mit den Nutzerrechten."
            - "LawRelay verwendet keine optionalen Analysen."
        sharing:
          heading: "4. Empfänger"
          paragraphs:
            - "Daten werden nur für den Betrieb geteilt: mit dem anfragenden oder antwortenden Anwalt, soweit der Ablauf dies erfordert, befugten LawRelay-Mitarbeitern und vertraglichen Anbietern für Hosting, transaktionale E-Mail, Sicherheit und Sicherung."
            - "Daten werden nicht verkauft."
        transfers:
          heading: "5. Ort und Übermittlungen"
          paragraphs:
            - "Hetzner hostet die Anwendung in Deutschland. Verschlüsselte Backups liegen in AWS S3 in Frankfurt. Migadu, ein Schweizer E-Mail-Anbieter, gibt an, dass sich seine E-Mail-Server in Frankreich befinden."
        retention:
          heading: "6. Aufbewahrung"
          paragraphs:
            - "Konto- und Marktplatzdaten werden aufbewahrt, solange Ihr Konto aktiv ist, und danach auf Anfrage gelöscht, sofern keine berufsrechtlichen, vertraglichen, Sicherheits- oder gesetzlichen Pflichten eine Aufbewahrung erfordern."
            - "Backups folgen einem Schema von 7 täglichen, 4 wöchentlichen und 12 monatlichen Sicherungen. Betroffenenanträge werden manuell bearbeitet."
        rights:
          heading: "7. Ihre Rechte"
          paragraphs:
            - "Je nach Rechtsgrundlage und Umständen können Sie Auskunft, Berichtigung, Löschung, Einschränkung oder Übertragbarkeit verlangen oder widersprechen. Eine Einwilligung kann ohne Auswirkung auf die vorherige rechtmäßige Verarbeitung widerrufen werden."
            - "Sie können sich bei der belgischen Datenschutzbehörde beschweren. LawRelay darf Ihre Identität vor Bearbeitung eines Antrags prüfen."
        security:
          heading: "8. Sicherheit, Vorfälle und Änderungen"
          paragraphs:
            - "LawRelay setzt risikogerechte Zugriffskontrollen, Transportverschlüsselung, sichere Authentifizierung, begrenzte Protokollierung, Backups, Überwachung und Vorfallverfahren ein. Kein Onlinedienst kann absolute Sicherheit versprechen."
            - "Wesentliche Änderungen werden datiert und, soweit angemessen, im Dienst oder per E-Mail mitgeteilt."
    terms:
      meta_title: "Nutzungsbedingungen — LawRelay"
      eyebrow: "Nutzungsbedingungen"
      title: "Bedingungen"
      introduction: "Für die LawRelay-Beta."
      operator_contact_heading: "Betreiber"
      sections:
        agreement:
          heading: "1. Vertrag und Betreiber"
          paragraphs:
            - "Vertragspartner ist der oben genannte Betreiber. Bei der Registrierung stimmen Sie diesen Bedingungen zu."
        eligibility:
          heading: "2. Zugang und Verifizierung"
          paragraphs:
            - "Die Registrierung steht Anwälten im offiziellen Verzeichnis von advocaat.be offen. Der Marktplatz-Zugang folgt nach einer Prüfung in diesem Verzeichnis. Nutzer machen richtige berufliche Angaben, halten sie aktuell, schützen den Zugang und melden Kompromittierungen sofort. Verifizierung ist weder Empfehlung noch Kompetenzgarantie."
        role:
          heading: "3. Rolle von LawRelay"
          paragraphs:
            - "LawRelay stellt Software bereit, um Aufträge zu veröffentlichen, Antworten zu erhalten und eine Vermittlung zwischen Anwälten zu koordinieren. Es ist keine Kanzlei, kein Arbeitgeber, Mandant, Vertreter, Treuhanddienst und keine Partei der Zusammenarbeit und erteilt keine Rechtsberatung."
        professional_duties:
          heading: "4. Berufliche Verantwortung"
          bullets:
            - "Jeder Anwalt bleibt verantwortlich für die Befugnis zur Delegation, Konfliktprüfung, Unabhängigkeit, Kompetenz, Fristen, Gerichtsregeln, Berufsgeheimnis, Versicherung, Mandantenkommunikation und alle Kammerpflichten."
            - "Eine Vermittlung oder ein Verifizierungsstatus ersetzt nie die eigene Prüfung."
            - "Umfang, Honorar, Abrechnung und praktische Durchführung vereinbaren die Nutzer direkt."
        content:
          heading: "5. Aufträge und verbotene Inhalte"
          paragraphs:
            - "Nutzer veröffentlichen nur richtige, notwendige berufliche Informationen, die sie teilen dürfen. Mandantenidentitäten, Sachverhalte, Dokumente, Beweise, vertrauliche Kommunikation, rechtswidrige Inhalte, Spam, diskriminierende Anfragen und irreführende Angebote sind verboten."
            - "LawRelay darf Inhalte entfernen, beschränken oder sichern, wenn dies für Sicherheit, Compliance, Streitigkeiten oder rechtliche Pflichten angemessen erforderlich ist."
        workflow:
          heading: "6. Antworten und Vermittlungen"
          paragraphs:
            - "Der Auftraggeber entscheidet, wen er kontaktiert oder auswählt. LawRelay garantiert keine Antwort, Vermittlung, Verfügbarkeit, Ergebnis, Qualität oder Zahlung durch andere Nutzer. Jede Beauftragung und Frist ist außerhalb der Plattform zu bestätigen."
        beta_access:
          heading: "7. Beta"
          paragraphs:
            - "LawRelay ist in der Beta. Funktionen können sich ändern."
        professional_fees:
          heading: "8. Anwaltshonorare"
          paragraphs:
            - "Honorare für einen Auftrag werden direkt zwischen Anwälten oder Kanzleien vereinbart, fakturiert und bezahlt. LawRelay verwahrt diese Gelder nicht, zieht keine Provision ab und garantiert keine Zahlung."
        moderation:
          heading: "9. Meldung, Moderation und Sperrung"
          paragraphs:
            - "Nutzer können rechtswidrige, unsichere oder regelwidrige Inhalte an support@lawrelay.be melden. LawRelay darf prüfen, Informationen anfordern, Inhalte beschränken, Zugänge sperren oder Konten verhältnismäßig beenden."
            - "Wenn Sie mit einer Moderationsentscheidung nicht einverstanden sind, antworten Sie auf die Entscheidungs-E-Mail oder schreiben Sie mit Bezug auf Konto und Auftrag an support@lawrelay.be. LawRelay prüft die Anfrage und antwortet innerhalb einer angemessenen Frist."
        intellectual_property:
          heading: "10. Geistiges Eigentum"
          paragraphs:
            - "Nutzer behalten die Rechte an ihren privaten Daten und eingereichten Inhalten und erteilen LawRelay eine beschränkte Lizenz, diese ausschließlich zum Betrieb und zur Sicherung des Dienstes zu hosten, anzuzeigen, zu übertragen und zu verarbeiten. Die LawRelay-Software ist auf GitHub unter der GNU Affero General Public License, Version 3 oder höher, verfügbar; diese Lizenz macht private Nutzerdaten nicht öffentlich. LawRelay behält Rechte an seiner Marke."
        availability:
          heading: "11. Verfügbarkeit und Änderungen"
          paragraphs:
            - "LawRelay darf den Dienst warten, aktualisieren oder ändern und verspricht keine unterbrechungsfreie Verfügbarkeit. Wesentliche Änderungen der Beta werden soweit möglich angemessen vorab mitgeteilt."
        liability:
          heading: "12. Haftung, Beendigung und Recht"
          paragraphs:
            - "Sie können die Beta jederzeit nicht mehr nutzen und die Löschung Ihres Kontos unter support@lawrelay.be verlangen. LawRelay kann den Beta-Zugang mit angemessener Frist oder sofort beenden, wenn dies für Sicherheit, Gesetz oder diese Bedingungen erforderlich ist."
            - "Diese Bedingungen unterliegen belgischem Recht. Zwingende Rechte, die auf Sie anwendbar sind, bleiben unberührt. Diese Bedingungen schließen keine Haftung aus, die gesetzlich nicht ausgeschlossen werden darf."
    cookies:
      meta_title: "Cookie-Hinweise — LawRelay"
      eyebrow: "Cookies"
      title: "Cookies"
      introduction: "Nur notwendige Cookies."
      sections:
        current_use:
          heading: "1. Was derzeit verwendet wird"
          paragraphs:
            - "Erforderliche signierte Sitzungs- und Formularsicherheitscookies halten Sie angemeldet und schützen Formulare vor gefälschten Anfragen. Eine Anmeldungssitzung dauert höchstens 30 Tage und endet früher bei Abmeldung, Passwortzurücksetzung oder Sitzungswiderruf. Diese Cookies sind für den angeforderten Dienst unbedingt erforderlich."
        no_tracking:
          heading: "2. Kein optionales Tracking in der aktuellen Fassung"
          paragraphs:
            - "LawRelay setzt derzeit keine Werbe-, Profiling- oder optionalen Analyse-Cookies. Die Sprache steht in der Seiten-URL und nicht in einem Tracking-Cookie."
        retention:
          heading: "3. Dauer und Kontrolle"
          paragraphs:
            - "Sitzungstechnik wird auf Dauer und Sicherheitsbedarf des Dienstes beschränkt. Sie können Cookies im Browser löschen; das Blockieren notwendiger Cookies kann jedoch Anmeldung oder Formulare verhindern."
        future:
          heading: "4. Falls optionale Cookies hinzukommen"
          paragraphs:
            - "LawRelay aktualisiert diese Hinweise und holt vorherige, granulare Einwilligung ein, bevor nicht erforderliche Cookies genutzt werden. Ablehnen muss so einfach wie Annehmen sein und die Einwilligung widerrufbar bleiben."
        contact:
          heading: "5. Fragen"
          paragraphs:
            - "Fragen zu Cookies und Datenschutz können an den Datenschutzkontakt im Impressum gerichtet werden."
