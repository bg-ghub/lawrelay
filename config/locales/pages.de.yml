    privacy:
      meta_title: "Datenschutzhinweise — LawRelay"
      eyebrow: "Datenschutz"
      title: "Datenschutz"
      introduction: "Welche Daten wir nutzen und warum."
      operator_contact_heading: "Kontakt"
      sections:
        controller:
          heading: "1. Wer verantwortlich ist"
          paragraphs:
            - "Der oben genannte Betreiber von LawRelay ist Verantwortlicher."
            - "Datenschutzfragen und Betroffenenanträge: privacy@lawrelay.be. Wir gleichen Ihren Namen und Ihre berufliche E-Mail-Adresse mit advocaat.be ab und bestätigen Ihre E-Mail-Adresse. Ist die veröffentlichte Adresse nicht erreichbar, kann ein Administrator eine andere bestätigte Adresse anhand unabhängig veröffentlichter beruflicher Kontaktdaten prüfen."
        scope:
          heading: "2. Welche Daten wir verarbeiten"
          bullets:
            - "Konto- und Kontaktdaten wie Name, berufliche E-Mail-Adresse, bevorzugte Sprache und Authentifizierungsdaten. Anträge auf eine andere Adresse, Entscheidungen und Prüfvermerke werden mit Ihrem Berufsprofil gespeichert."
            - "Bei aktivierter Zwei-Faktor-Authentifizierung speichern wir Authenticator-Schlüssel verschlüsselt und Wiederherstellungscodes als Hashwerte."
            - "Auf Ihren Wunsch übernehmen wir den öffentlichen Namen, die E-Mail-Adresse, Sprachen und Rechtsgebiete von advocaat.be zum Vorausfüllen der Anmeldung. Die Vorschau ist 20 Minuten gültig."
            - "Wir prüfen Ihr advocaat.be-Profil täglich. Der Betreiber wird über ein fehlendes oder geändertes Profil informiert."
            - "Berufliche Identität: offizielles Verzeichnisprofil, veröffentlichter Name und E-Mail-Adresse sowie beruflicher Prüfstatus."
            - "Daten zum beruflichen Profil und zu Vermittlungspräferenzen, einschließlich Rechtsgebieten, Gerichtspräferenzen und—soweit für juristische Aufgaben relevant—gesprochenen Sprachen; außerdem Auftrags-, Bewerbungs-, Annahme-, Stornierungs- und Auditdaten."
            - "Supportkommunikation und technische oder sicherheitsbezogene Daten wie IP-Adresse, Anfragekennung, Geräteinformation und Sicherheitsereignisse."
            - "Nur für nicht angemeldete öffentliche Besuche: cookielose Umami-Statistiken mit einem begrenzten Seitenpfad, der Herkunft des Referrers und gewöhnlichen Metadaten der Browseranfrage. Wir senden keine Kontodaten, privaten Seiten, Formulare, Abfragen oder Auftragsdaten."
            - "Für anonyme Besucher außerhalb Belgiens bestimmt eine lokale Sicherheitsprüfung anhand der IP-Adresse das Land und speichert kurz einen Prüfungsnachweis."
          paragraphs:
            - "LawRelay ist nicht für Mandantennamen, Sachverhalte, Schriftsätze, Beweismittel, Dokumente oder vertrauliche Kommunikation bestimmt. Diese Informationen müssen in Systemen unter Kontrolle der beteiligten Anwälte bleiben."
            - "Nach Annahme tauschen die Anwälte die Angaben zum Rechnungsempfänger und die Peppol-Daten privat aus."
        purposes:
          heading: "3. Zwecke und Rechtsgrundlagen"
          bullets:
            - "Konten anlegen und sichern, Berechtigung prüfen und Vermittlungsfunktionen bereitstellen: Erfüllung des Dienstleistungsvertrags."
            - "Missbrauch verhindern, den Dienst sichern, Nutzer unterstützen, Zuverlässigkeit verbessern und Ansprüche begründen oder abwehren: berechtigte Interessen nach Abwägung mit den Nutzerrechten."
            - "Um die Nutzung öffentlicher Seiten zu verstehen und den Dienst zu verbessern: begrenzte, cookielose aggregierte Statistiken auf Grundlage unserer berechtigten Interessen. Sie können die Statistiken in der Fußzeile ausschalten. Do Not Track und Global Privacy Control werden beachtet."
        sharing:
          heading: "4. Empfänger"
          paragraphs:
            - "Offene Aufträge sind für verifizierte Mitglieder sichtbar. Angebote sind für den einreichenden Anwalt und die Mitglieder im Arbeitsbereich des Auftraggebers sichtbar. Nach Annahme erhalten der Auftraggeber und der ausgewählte Anwalt die E-Mail-Adresse des jeweils anderen."
            - "Der Betreiber und die unten genannten Hosting-, E-Mail- und Backup-Anbieter verarbeiten die für den Betrieb nötigen Daten. Daten werden nicht verkauft."
        transfers:
          heading: "5. Ort und Übermittlungen"
          paragraphs:
            - "Hetzner hostet die Anwendung in Deutschland. Verschlüsselte Backups liegen in AWS S3 in Frankfurt. Migadu, ein Schweizer E-Mail-Anbieter, gibt an, dass sich seine E-Mail-Server in Frankreich befinden."
            - "Anbieter können Konto- und Supportdaten auch außerhalb des EWR verarbeiten. Für die Schweiz gilt ein Angemessenheitsbeschluss der EU; der Datenverarbeitungsvertrag von AWS enthält bei Bedarf Standardvertragsklauseln. Weitere Informationen oder eine Kopie der Garantien erhalten Sie unter privacy@lawrelay.be."
        retention:
          heading: "6. Aufbewahrung"
          paragraphs:
            - "Das letzte Ergebnis der Profilprüfung bleibt bei Ihrem Konto. Prüfübersichten und erledigte Warnungen: 90 Tage. Offene Warnungen können für Untersuchungen aufbewahrt werden."
            - "Ungenutzte, unbestätigte Registrierungen: 30 Tage Inaktivität. Analysen öffentlicher Seiten: 90 Tage. Erledigte Benachrichtigungen: 90 Tage ab Erstellung; ausstehende, fehlgeschlagene oder geschützte Benachrichtigungen können zur Prüfung erhalten bleiben. Abgeschlossene Aufträge und Angebote: 2 Jahre ab Abschluss. Erledigte Datenschutzanfragen und Meldungen: 2 Jahre ab Erledigung. Abgeschlossene Supportgespräche: 2 Jahre ab Abschluss oder der letzten Antwort, je nachdem, was später liegt. Prüfprotokolle: 1 Jahr. Technische Protokolle: höchstens 31 Tage."
            - "Konten bleiben bis zur Schließung bestehen. Sie können Ihr Konto in Profil nach Bestätigung Ihres Passworts löschen. Wir entfernen nicht mehr benötigte Daten. Gemeinsame Auftragsdaten können 2 Jahre pseudonymisiert bleiben, ebenso minimale Löschvermerke. Offene Aufträge, Untersuchungen, Streitfälle oder gesetzliche Pflichten können eine längere Aufbewahrung erfordern."
            - "Backups werden 30 Tage aufbewahrt. Gelöschte Daten können vorübergehend noch in verschlüsselten Backups oder Speicherversionen vorhanden sein, höchstens etwa 60 Tage."
        rights:
          heading: "7. Ihre Rechte"
          paragraphs:
            - "Je nach Rechtsgrundlage und Umständen können Sie Auskunft, Berichtigung, Löschung, Einschränkung oder Übertragbarkeit verlangen oder der Verarbeitung widersprechen. Schreiben Sie an privacy@lawrelay.be. Wir antworten in der Regel innerhalb eines Monats. Ist eine zulässige Verlängerung nötig, informieren wir Sie innerhalb dieses Monats."
            - "Sie können sich bei der belgischen Datenschutzbehörde beschweren. LawRelay darf Ihre Identität vor Bearbeitung eines Antrags prüfen."
        security:
          heading: "8. Sicherheit, Vorfälle und Änderungen"
          paragraphs:
            - "LawRelay nutzt Zugriffskontrollen, Transportverschlüsselung, sichere Authentifizierung, begrenzte Protokollierung, Backups, Überwachung und Vorfallverfahren. Kein Onlinedienst kann absolute Sicherheit versprechen."
            - "Wesentliche Änderungen werden datiert und, soweit angemessen, im Dienst oder per E-Mail mitgeteilt."
    terms:
      meta_title: "Nutzungsbedingungen — LawRelay"
      eyebrow: "Nutzungsbedingungen"
      title: "Bedingungen"
      introduction: "Für die LawRelay-Beta."
      operator_contact_heading: "Betreiber"
      sections:
        agreement:
          heading: "1. Vertrag und Betreiber"
          paragraphs:
            - "Vertragspartner ist der oben genannte Betreiber. Bei der Registrierung stimmen Sie diesen Bedingungen zu."
        eligibility:
          heading: "2. Zugang und Verifizierung"
          paragraphs:
            - "Die Registrierung steht Anwälten auf advocaat.be offen. Der Zugang erfordert die Prüfung des Profils und der E-Mail-Adresse. Ist die veröffentlichte Adresse nicht erreichbar, prüft ein Administrator Ihre Identität und die bestätigte neue Adresse. Nutzer halten berufliche Angaben aktuell, schützen ihren Zugang und melden Missbrauch. Die Verifizierung ist weder Empfehlung noch Kompetenzgarantie."
        role:
          heading: "3. Rolle von LawRelay"
          paragraphs:
            - "Mit LawRelay können Sie Aufträge veröffentlichen und aus den Antworten auswählen. Die Beauftragung erfolgt zwischen den Anwälten; LawRelay ist dabei keine Vertragspartei."
        professional_duties:
          heading: "4. Berufliche Verantwortung"
          bullets:
            - "Jeder Anwalt bleibt verantwortlich für die Befugnis zur Delegation, Konfliktprüfung, Unabhängigkeit, Kompetenz, Fristen, Gerichtsregeln, Berufsgeheimnis, Versicherung, Mandantenkommunikation und alle Kammerpflichten."
            - "Eine Vermittlung oder ein Verifizierungsstatus ersetzt nie die eigene Prüfung."
            - "Umfang, Honorar, Abrechnung und praktische Durchführung vereinbaren die Nutzer direkt. Nach Annahme tauschen sie die Angaben zum Rechnungsempfänger und die Peppol-Daten privat aus."
        content:
          heading: "5. Aufträge und verbotene Inhalte"
          paragraphs:
            - "Nutzer veröffentlichen nur richtige, notwendige berufliche Informationen, die sie teilen dürfen. Mandantenidentitäten, Sachverhalte, Dokumente, Beweise, vertrauliche Kommunikation, rechtswidrige Inhalte, Spam, diskriminierende Anfragen und irreführende Angebote sind verboten."
            - "LawRelay darf Inhalte entfernen, beschränken oder sichern, wenn dies für Sicherheit, Compliance, Streitigkeiten oder rechtliche Pflichten angemessen erforderlich ist."
        workflow:
          heading: "6. Antworten und Vermittlungen"
          paragraphs:
            - "Der Auftraggeber entscheidet, wen er kontaktiert oder auswählt. LawRelay garantiert keine Antwort, Vermittlung, Verfügbarkeit, Ergebnis, Qualität oder Zahlung durch andere Nutzer. Jede Beauftragung und Frist ist außerhalb der Plattform zu bestätigen."
        beta_access:
          heading: "7. Beta"
          paragraphs:
            - "LawRelay ist in der Beta. Funktionen können sich ändern."
        professional_fees:
          heading: "8. Anwaltshonorare"
          paragraphs:
            - "Honorare für einen Auftrag werden direkt zwischen Anwälten oder Kanzleien vereinbart, fakturiert und bezahlt. LawRelay verwahrt diese Gelder nicht, zieht keine Provision ab und garantiert keine Zahlung."
        moderation:
          heading: "9. Meldung, Moderation und Sperrung"
          paragraphs:
            - "Nutzer können rechtswidrige, unsichere oder regelwidrige Inhalte an support@lawrelay.be melden. LawRelay darf prüfen, Informationen anfordern, Inhalte beschränken, Zugänge sperren oder Konten verhältnismäßig beenden."
            - "Um eine Moderationsentscheidung anzufechten, schreiben Sie mit der Konto- oder Auftragsreferenz an support@lawrelay.be. LawRelay prüft dies und antwortet innerhalb einer angemessenen Frist."
        intellectual_property:
          heading: "10. Geistiges Eigentum"
          paragraphs:
            - "Nutzer behalten die Rechte an ihren privaten Daten und eingereichten Inhalten und erteilen LawRelay eine beschränkte Lizenz, diese ausschließlich zum Betrieb und zur Sicherung des Dienstes zu hosten, anzuzeigen, zu übertragen und zu verarbeiten. Die LawRelay-Software ist auf GitHub unter der GNU Affero General Public License, Version 3 oder höher, verfügbar; diese Lizenz macht private Nutzerdaten nicht öffentlich. LawRelay behält Rechte an seiner Marke."
        availability:
          heading: "11. Verfügbarkeit und Änderungen"
          paragraphs:
            - "LawRelay darf den Dienst warten, aktualisieren oder ändern und verspricht keine unterbrechungsfreie Verfügbarkeit. Wesentliche Änderungen der Beta werden soweit möglich angemessen vorab mitgeteilt."
        liability:
          heading: "12. Haftung, Beendigung und Recht"
          paragraphs:
            - "Sie können die Beta jederzeit nicht mehr nutzen und Ihr Konto in Profil nach Bestätigung Ihres Passworts löschen. LawRelay kann den Beta-Zugang mit angemessener Frist oder sofort beenden, wenn dies für Sicherheit, Gesetz oder diese Bedingungen erforderlich ist."
            - "Diese Bedingungen unterliegen belgischem Recht. Zwingende Rechte, die auf Sie anwendbar sind, bleiben unberührt. Diese Bedingungen schließen keine Haftung aus, die gesetzlich nicht ausgeschlossen werden darf."
    cookies:
      meta_title: "Cookie-Hinweise — LawRelay"
      eyebrow: "Cookies"
      title: "Cookies"
      introduction: "Nur notwendige Cookies."
      sections:
        current_use:
          heading: "1. Was derzeit verwendet wird"
          paragraphs:
            - "Erforderliche signierte Sitzungs- und Formularsicherheitscookies halten Sie angemeldet und schützen Formulare vor gefälschten Anfragen. Eine Anmeldungssitzung dauert höchstens 30 Tage und endet früher bei Abmeldung, Passwortzurücksetzung oder Sitzungswiderruf. Für anonyme Besucher außerhalb Belgiens verwendet die Sicherheitsprüfung ein signiertes Prüfungs-Cookie für 24 Stunden und ein Rückkehrpfad-Cookie für höchstens 10 Minuten. Das Präferenzcookie für Statistiken speichert Ihre Einstellung 180 Tage. Ein separates Hinweis-Cookie merkt sich 180 Tage, dass der Informationsbanner geschlossen wurde. Umami selbst verwendet keine Cookies."
        no_tracking:
          heading: "2. Analysen öffentlicher Seiten"
          paragraphs:
            - "LawRelay verwendet selbst gehostetes Umami für begrenzte, cookielose aggregierte Statistiken über nicht angemeldete öffentliche Seiten. Es verfolgt keine Werbung, erstellt keine Profile und erfasst keine Kontoseiten, Formulare, Seitenparameter oder Auftragsdaten. Über Statistiken in der Fußzeile können Sie Statistiken aus- oder wieder einschalten. Do Not Track und Global Privacy Control verhindern Statistiken."
        retention:
          heading: "3. Dauer und Kontrolle"
          paragraphs:
            - "Sitzungstechnik wird auf Dauer und Sicherheitsbedarf des Dienstes beschränkt. Sie können Cookies im Browser löschen; das Blockieren notwendiger Cookies kann jedoch Anmeldung oder Formulare verhindern."
        future:
          heading: "4. Falls optionale Cookies hinzukommen"
          paragraphs:
            - "LawRelay aktualisiert diese Hinweise und holt vorherige, granulare Einwilligung ein, bevor nicht erforderliche Cookies genutzt werden. Ablehnen muss so einfach wie Annehmen sein und die Einwilligung widerrufbar bleiben."
        contact:
          heading: "5. Fragen"
          paragraphs:
            - "Fragen zu Cookies und Datenschutz können an den Datenschutzkontakt im Impressum gerichtet werden."
