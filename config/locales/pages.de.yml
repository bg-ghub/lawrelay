      eyebrow: "Beta"
      title: "Preise"
      introduction: "Für Anwälte auf advocaat.be, nach Verifizierung."
      beta:
        kicker: "Beta"
        price: "0 €"
        title: "Kostenlos während der Beta"
        body: "Aufträge einstellen und beantworten. Keine Zahlungsdaten nötig."
        features:
          - "Registrierung offen für auf advocaat.be gelistete Anwälte"
          - "Verzeichnisprüfung vor Marktplatz-Zugang"
          - "Berufliche Aufträge einstellen und beantworten"
          - "Direktes Feedback an das LawRelay-Team"
      direct_fees:
        title: "Honorare"
        body: "Vereinbaren Sie das Honorar und rechnen Sie direkt miteinander ab. LawRelay wickelt keine Zahlungen ab und erhält keine Provision."
