  pages:
    shared:
      version: "Laatst bijgewerkt: %{date}"
      not_configured: "Niet beschikbaar"
      navigation_label: "Commerciële en juridische informatie"
      draft_warning_title: "Gegevens van de uitbater zijn niet beschikbaar"
      draft_warning_body: "De gegevens van de uitbater konden niet worden geladen. Neem contact op met LawRelay voordat u de dienst gebruikt."
    navigation:
      pricing: "Prijzen"
      privacy: "Privacy"
