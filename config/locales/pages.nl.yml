    pricing:
      meta_title: "Prijzen — LawRelay"
      eyebrow: "bèta"
      title: "Prijzen"
      introduction: "Voor advocaten op advocaat.be, na verificatie."
      beta:
        kicker: "bèta"
        price: "€0"
        title: "Gratis tijdens de bèta"
        body: "Plaats opdrachten en reageer. Geen betaalgegevens nodig."
        features:
          - "Registratie open voor advocaten op advocaat.be"
          - "Lijstcontrole vóór toegang tot de marktplaats"
          - "Professionele opdrachten plaatsen en beantwoorden"
          - "Rechtstreekse feedback aan het LawRelay-team"
      direct_fees:
        title: "Erelonen"
        body: "Spreek het ereloon af en factureer elkaar rechtstreeks. LawRelay verwerkt geen betalingen en houdt geen commissie in."
      review_notice: "Toegang tot de bèta is gratis. LawRelay int tijdens deze bèta geen platformkosten."
    privacy:
      meta_title: "Privacyverklaring — LawRelay"
      eyebrow: "privacy"
      title: "Privacy"
      introduction: "Welke gegevens we gebruiken en waarom."
      operator_contact_heading: "Contact"
      sections:
        controller:
          heading: "1. Wie verantwoordelijk is"
          paragraphs:
            - "De hierboven vermelde uitbater van LawRelay is verwerkingsverantwoordelijke."
            - "Privacyvragen en verzoeken over uw rechten: privacy@lawrelay.be. We vergelijken uw naam en professionele e-mailadres met advocaat.be en bevestigen uw e-mail. Kunt u het vermelde adres niet gebruiken, dan kan een beheerder een ander bevestigd adres beoordelen via onafhankelijke professionele contactgegevens."
        scope:
          heading: "2. Welke gegevens we verwerken"
          bullets:
            - "Account- en contactgegevens, zoals naam, professioneel e-mailadres, taalvoorkeur en authenticatiegegevens. Aanvragen voor een ander e-mailadres, beslissingen en controlenotities bewaren we bij uw professionele profiel."
            - "Als u tweestapsverificatie inschakelt, bewaren we authenticatorsleutels versleuteld en herstelcodes als hashes."
            - "Op uw verzoek halen we uw openbare naam, e-mailadres, talen en rechtsdomeinen van advocaat.be op om het registratieformulier in te vullen. Het voorbeeld is 20 minuten geldig."
            - "We controleren dagelijks je advocaat.be-profiel en ondernemingsnummer in de KBO. De beheerder krijgt een melding bij een inactieve onderneming of een verdwenen of gewijzigd profiel."
            - "Professionele en facturatiegegevens: uw officiële profiel, vermelde naam en e-mailadres, ondernemingsnaam, ondernemings-/btw-nummer, contactgegevens en professionele verificatiestatus. Als u via de officiële publieke KBO-zoekpagina zelf een ondernemingsnummer opzoekt, bewaren we de teruggegeven facturatiegegevens (naam, nummer en, waar beschikbaar, zeteladres) en de datum van de KBO-gegevens."
            - "Gegevens over het professionele profiel en matchvoorkeuren, waaronder rechtsdomeinen, rechtbankvoorkeuren en—waar relevant voor juridische opdrachten—gesproken talen; ook opdracht-, kandidatuur-, aanvaardings-, annulerings- en auditgegevens."
            - "Facturatiegegevens per opdracht, zoals professionele naam en ondernemings-/btw-nummer. Geverifieerde kijkers van de opdracht zien naam en nummer; het kantoor van de opdrachtgever en de gekozen confrater zien het volledige facturatieadres en e-mailadres."
            - "Supportcommunicatie en technische of beveiligingsgegevens, zoals IP-adres, request-ID, apparaatgegevens en beveiligingsgebeurtenissen."
            - "Alleen voor niet-aangemelde openbare bezoeken: cookieless Umami-statistieken met een beperkt paginapad, de oorsprong van de verwijzer en gewone metadata van het browserverzoek. We sturen geen accountgegevens, private pagina's, formulieren, zoekopdrachten of opdrachtdetails door."
            - "Voor anonieme bezoekers buiten België gebruikt een lokale beveiligingscontrole het IP-adres om het land te bepalen en bewaart zij kort een verificatierecord."
          paragraphs:
            - "LawRelay is niet bedoeld voor cliëntnamen, dossierfeiten, conclusies, bewijsstukken, documenten of vertrouwelijke communicatie. Die informatie hoort in systemen onder controle van de betrokken advocaten."
        purposes:
          heading: "3. Waarom en op welke grond"
          bullets:
            - "Accounts aanmaken en beveiligen, toegang verifiëren en matching aanbieden: uitvoering van de dienstenovereenkomst."
            - "Misbruik voorkomen, de dienst beveiligen, gebruikers helpen, betrouwbaarheid verbeteren en rechtsvorderingen instellen of verdedigen: gerechtvaardigde belangen, afgewogen tegen gebruikersrechten."
            - "Om het gebruik van openbare pagina's te begrijpen en de dienst te verbeteren: beperkte, cookieless geaggregeerde statistieken op basis van ons gerechtvaardigd belang. U kunt statistieken in de footer uitzetten. Do Not Track en Global Privacy Control worden gerespecteerd."
        sharing:
          heading: "4. Met wie gegevens worden gedeeld"
          paragraphs:
            - "Open opdrachten zijn zichtbaar voor geverifieerde leden. Reacties zijn zichtbaar voor de reagerende advocaat en het kantoor van de opdrachtgever. Na aanvaarding ontvangen de opdrachtgever en de gekozen advocaat elkaars e-mailadres."
            - "De uitbater en de hieronder vermelde hosting-, e-mail- en back-upleveranciers verwerken gegevens voor de werking van de dienst. Gegevens worden niet verkocht."
        transfers:
          heading: "5. Locatie en doorgiften"
          paragraphs:
            - "Hetzner host de toepassing in Duitsland. Versleutelde back-ups staan in AWS S3 Frankfurt. Migadu, een Zwitserse e-mailprovider, vermeldt dat zijn e-mailservers in Frankrijk staan."
            - "Leveranciers kunnen account- en supportgegevens ook buiten de EER verwerken. Voor Zwitserland geldt een adequaatheidsbesluit van de EU; de verwerkersovereenkomst van AWS bevat waar nodig standaardcontractbepalingen. Vraag privacy@lawrelay.be om meer informatie of een kopie van de waarborgen."
        retention:
          heading: "6. Bewaring"
          paragraphs:
            - "De laatste registercontrole blijft bij je account. Controleoverzichten en afgehandelde waarschuwingen: 90 dagen. Open waarschuwingen kunnen voor onderzoek bewaard blijven."
            - "Ongebruikte, onbevestigde registraties: 30 dagen inactiviteit. Analytics van openbare pagina's: 90 dagen. Afgehandelde meldingen: 90 dagen vanaf aanmaak; nog te verwerken, mislukte of beschermde meldingen kunnen voor onderzoek bewaard blijven. Afgesloten opdrachten en reacties: 2 jaar na afsluiting. Afgehandelde privacyverzoeken en meldingsdossiers: 2 jaar na afhandeling. Afgesloten supportgesprekken: 2 jaar na afsluiting, of na het laatste antwoord als dat later kwam. Auditlogs: 1 jaar. Technische logs: maximaal 31 dagen."
            - "Accounts blijven bestaan tot afsluiting. Je kunt je account in Profiel verwijderen na bevestiging van je wachtwoord. We verwijderen gegevens die niet meer nodig zijn. Gedeelde opdrachtgegevens kunnen 2 jaar gepseudonimiseerd blijven, net als minimale verwijderregistraties. Open opdrachten, onderzoeken, geschillen of wettelijke plichten kunnen langere bewaring vereisen."
            - "Back-ups worden 30 dagen bewaard. Verwijderde gegevens kunnen nog tijdelijk in versleutelde back-ups of opslagversies staan, maximaal ongeveer 60 dagen."
        rights:
          heading: "7. Uw rechten"
          paragraphs:
            - "Afhankelijk van grondslag en omstandigheden kunt u inzage, correctie, verwijdering, beperking of overdraagbaarheid vragen of bezwaar maken. Schrijf naar privacy@lawrelay.be. We antwoorden normaal binnen één maand. Als een wettelijke verlenging nodig is, melden we dat binnen die maand."
            - "U kunt klacht indienen bij de Gegevensbeschermingsautoriteit. LawRelay kan uw identiteit controleren vóór een verzoek wordt uitgevoerd."
        security:
          heading: "8. Beveiliging, incidenten en wijzigingen"
          paragraphs:
            - "LawRelay gebruikt toegangscontrole, versleuteling tijdens transport, veilige authenticatie, beperkte logging, back-ups, monitoring en incidentprocedures. Geen enkele onlinedienst kan absolute veiligheid beloven."
            - "Belangrijke wijzigingen worden gedateerd en waar passend via de dienst of e-mail meegedeeld."
    terms:
      meta_title: "Gebruiksvoorwaarden — LawRelay"
      eyebrow: "gebruiksvoorwaarden"
      title: "Voorwaarden"
      introduction: "Voor de LawRelay-bèta."
      operator_contact_heading: "Uitbater"
      sections:
        agreement:
          heading: "1. Overeenkomst en uitbater"
          paragraphs:
            - "De hierboven vermelde uitbater is de contractspartij. Bij registratie aanvaardt u deze voorwaarden."
        eligibility:
          heading: "2. Toegang en verificatie"
          paragraphs:
            - "Registratie staat open voor advocaten op advocaat.be. Toegang vereist controle van het profiel en e-mailadres. Is het vermelde adres onbereikbaar, dan beoordeelt een beheerder uw identiteit en bevestigde nieuwe adres. Gebruikers houden hun professionele gegevens actueel, beschermen hun toegang en melden misbruik. Verificatie is geen aanbeveling of kwaliteitsgarantie."
        role:
          heading: "3. Rol van LawRelay"
          paragraphs:
            - "Met LawRelay kunt u opdrachten publiceren en uit de reacties kiezen. De samenwerking is tussen de advocaten; LawRelay is daarbij geen partij."
        professional_duties:
          heading: "4. Professionele verantwoordelijkheid"
          bullets:
            - "Elke advocaat blijft verantwoordelijk voor bevoegdheid tot uitbesteding, belangenconflicten, onafhankelijkheid, bekwaamheid, termijnen, rechtbankregels, beroepsgeheim, verzekering, cliëntcommunicatie en alle balieverplichtingen."
            - "Een match of verificatiestatus vervangt nooit het eigen onderzoek van de advocaat."
            - "Gebruikers spreken omvang, ereloon, facturatie en praktische uitvoering rechtstreeks af."
        content:
          heading: "5. Opdrachten en verboden inhoud"
          paragraphs:
            - "Gebruikers publiceren alleen correcte, noodzakelijke professionele informatie die ze mogen delen. Cliëntidentiteiten, dossierfeiten, documenten, bewijs, vertrouwelijke communicatie, onwettige inhoud, spam, discriminerende vragen en misleidende opdrachten zijn verboden."
            - "LawRelay kan inhoud verwijderen, beperken of bewaren wanneer dat redelijk nodig is voor veiligheid, naleving, geschillen of wettelijke verplichtingen."
        workflow:
          heading: "6. Reacties en matches"
          paragraphs:
            - "De opdrachtgever beslist wie hij contacteert of kiest. LawRelay garandeert geen reactie, match, beschikbaarheid, uitkomst, kwaliteit of betaling door een andere gebruiker. Gebruikers bevestigen elke samenwerking en termijn buiten het platform."
        beta_access:
          heading: "7. Bèta"
          paragraphs:
            - "LawRelay is in bèta. Functies kunnen veranderen."
        professional_fees:
          heading: "8. Erelonen"
          paragraphs:
            - "Erelonen voor een opdracht worden rechtstreeks tussen advocaten of kantoren afgesproken, gefactureerd en betaald. LawRelay houdt die middelen niet aan, trekt geen commissie af en garandeert geen betaling."
        moderation:
          heading: "9. Meldingen, moderatie en schorsing"
          paragraphs:
            - "Gebruikers kunnen onwettige, onveilige of regelbrekende inhoud melden via support@lawrelay.be. LawRelay kan onderzoeken, informatie vragen, inhoud beperken, toegang schorsen of een account proportioneel beëindigen."
            - "U kunt een moderatiebeslissing betwisten via support@lawrelay.be, met het account- of opdrachtnummer. LawRelay beoordeelt dit en antwoordt binnen een redelijke termijn."
        intellectual_property:
          heading: "10. Intellectuele eigendom"
          paragraphs:
            - "Gebruikers behouden rechten op privégegevens en ingediende inhoud en geven LawRelay een beperkte licentie om die uitsluitend voor werking en beveiliging te hosten, tonen, verzenden en verwerken. De LawRelay-software is beschikbaar op GitHub onder de GNU Affero General Public License, versie 3 of later; die licentie maakt privégegevens van gebruikers niet openbaar. LawRelay behoudt rechten op zijn merk."
        availability:
          heading: "11. Beschikbaarheid en wijzigingen"
          paragraphs:
            - "LawRelay kan de dienst onderhouden, bijwerken of wijzigen en belooft geen ononderbroken beschikbaarheid. Belangrijke wijzigingen aan de bèta worden waar haalbaar redelijk vooraf meegedeeld."
        liability:
          heading: "12. Aansprakelijkheid, einde en recht"
          paragraphs:
            - "Je kunt de bèta op elk moment niet meer gebruiken en je account in Profiel verwijderen na bevestiging van je wachtwoord. LawRelay kan toegang tot de bèta beëindigen met een redelijke kennisgeving of onmiddellijk wanneer dat nodig is voor beveiliging, wet of deze voorwaarden."
            - "Belgisch recht is van toepassing op deze voorwaarden. Dwingende rechten die op u van toepassing zijn, blijven onverlet. Niets in deze voorwaarden sluit aansprakelijkheid uit die wettelijk niet kan worden uitgesloten."
    cookies:
      meta_title: "Cookieverklaring — LawRelay"
      eyebrow: "cookies"
      title: "Cookies"
      introduction: "Alleen noodzakelijke cookies."
      sections:
        current_use:
          heading: "1. Wat vandaag wordt gebruikt"
          paragraphs:
            - "Noodzakelijke ondertekende sessie- en formulierbeveiligingscookies houden u aangemeld en beschermen formulieren tegen vervalste verzoeken. Een sessie duurt maximaal 30 dagen en eindigt eerder bij afmelding, wachtwoordreset of intrekking van de sessie. Voor een anonieme bezoeker buiten België gebruikt de beveiligingscontrole een ondertekende verificatiecookie gedurende 24 uur en een return-path-cookie gedurende maximaal 10 minuten. De voorkeurcookie voor Statistieken onthoudt uw instelling 180 dagen. Een aparte informatiecookie onthoudt 180 dagen dat u de informatiebanner sloot. Umami zelf gebruikt geen cookies."
        no_tracking:
          heading: "2. Analytics op openbare pagina's"
          paragraphs:
            - "LawRelay gebruikt self-hosted Umami voor beperkte, cookieless geaggregeerde statistieken over niet-aangemelde openbare pagina's. Het volgt geen advertenties, maakt geen profielen en registreert geen accountpagina's, formulieren, paginaqueries of opdrachtdetails. Via Statistieken in de footer kunt u statistieken uit- of weer inschakelen. Do Not Track en Global Privacy Control blokkeren statistieken."
        retention:
          heading: "3. Duur en controle"
          paragraphs:
            - "Sessietechnologie wordt beperkt tot de duur en beveiligingsbehoefte van de dienst. U kunt cookies via de browser wissen, maar blokkeren van noodzakelijke cookies kan login of formulieren verhinderen."
        future:
          heading: "4. Als optionele cookies worden toegevoegd"
          paragraphs:
            - "LawRelay werkt deze verklaring bij en vraagt voorafgaande, afzonderlijke toestemming vóór een niet-noodzakelijke cookie wordt gebruikt. Weigeren moet even eenvoudig zijn als aanvaarden en toestemming moet intrekbaar blijven."
        contact:
          heading: "5. Vragen"
          paragraphs:
            - "Vragen over cookies en privacy kunnen naar het privacycontact in het colofon."
