    court_cover:
      meta_title: "Terminsvertretung unter Rechtsanwälten — LawRelay"
      meta_description: "Finden Sie eine anwaltliche Terminsvertretung. Vergleichen Sie Profile, Honorare und Reisekosten und vereinbaren Sie die Vertretung über LawRelay."
      heading: "Eine Terminsvertretung organisieren"
      example:
        title: "Antrag auf Vertagung"
        description: "Termin in Antwerpen, Montag um 10:00 Uhr. Unterlagen und Schriftsätze bereits eingereicht."
        reply: "Für den Termin verfügbar. Pauschalhonorar, Reisekosten inbegriffen."
      introduction: "Sie können einen Gerichtstermin nicht selbst wahrnehmen? Veröffentlichen Sie einen Auftrag auf LawRelay und erhalten Sie Angebote von Anwaltskollegen. Sie entscheiden selbst, wem Sie die Vertretung übertragen."
      sections:
        request:
          heading: "Beschreiben Sie den Auftrag"
          body: "Geben Sie Gericht, Datum, Uhrzeit und praktische Hinweise an. Beschreiben Sie die erwartete Tätigkeit und ob Unterlagen oder Schriftsätze bereits eingereicht wurden. Ein Richtpreis ist freiwillig."
        choose:
          heading: "Vergleichen Sie die Angebote"
          body: "Prüfen Sie das Profil, das vorgeschlagene Honorar und die Reisekostenregelung. Soweit verfügbar, werden Entfernung und Fahrzeit geschätzt. Reisekosten können im Honorar enthalten sein oder gesondert angegeben werden."
        agree:
          heading: "Treffen Sie Ihre Vereinbarung"
          body: "Bestätigen Sie Ihre Auswahl und vereinbaren Sie das Honorar mit der gewählten Vertretung. Die Rechnungsstellung regeln Sie untereinander. Veröffentlichen Sie keine vertraulichen Akteninformationen; übermitteln Sie diese erst nach Einigung ausschließlich an die gewählte Person."
    legal_assignments:
      meta_title: "Juristische Aufträge zwischen Rechtsanwälten — LawRelay"
      meta_description: "Beauftragen Sie einen Anwaltskollegen mit juristischer Arbeit. Beschreiben Sie Umfang und Frist und vergleichen Sie die Angebote auf LawRelay."
      heading: "Juristische Arbeit vergeben"
      example:
        title: "Recherche zur Verjährung"
        description: "Kurze schriftliche Stellungnahme auf Niederländisch, bis Freitag."
        reply: "Ich kann die Stellungnahme am Donnerstag liefern. Abrechnung nach Stunden."
      introduction: "Sie suchen anwaltliche Unterstützung für juristische Arbeit? Veröffentlichen Sie einen klar abgegrenzten Auftrag auf LawRelay, etwa für Recherche, Beratung, einen Vertrag oder Schriftsätze. Sie können auch selbst Angebote für veröffentlichte Aufträge abgeben."
      sections:
        request:
          heading: "Grenzen Sie den Auftrag ab"
          body: "Beschreiben Sie das erwartete Ergebnis, den Umfang und die Frist. Nennen Sie die erforderliche Sprache und das Rechtsgebiet, damit der Auftrag beurteilt werden kann. Einen Richtpreis können Sie angeben; er ist nicht verpflichtend."
        choose:
          heading: "Prüfen Sie die Angebote"
          body: "Vergleichen Sie das berufliche Profil, die Antwort und das vorgeschlagene Honorar. Wählen Sie die Person, mit der Sie zusammenarbeiten möchten. Vereinbaren Sie die zu erbringende Arbeit und deren Ausführung."
        agree:
          heading: "Klären Sie die Einzelheiten"
          body: "Honorar und Rechnungsstellung regeln Sie untereinander. Veröffentlichen Sie keine Mandantennamen oder vertraulichen Akteninformationen. Übermitteln Sie die erforderlichen Unterlagen erst nach Einigung ausschließlich an die gewählte Person."
