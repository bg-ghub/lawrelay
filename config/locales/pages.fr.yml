      eyebrow: "bêta"
      title: "Tarifs"
      introduction: "Pour les avocats inscrits sur advocaat.be, après vérification."
      beta:
        kicker: "bêta"
        price: "0 €"
        title: "Gratuit pendant la bêta"
        body: "Publiez des missions et répondez aux offres. Aucune donnée de paiement nécessaire."
        features:
          - "Inscription ouverte aux avocats inscrits sur advocaat.be"
          - "Vérification de l'annuaire avant l'accès à la plateforme"
          - "Publier et répondre à des missions professionnelles"
          - "Retour direct à l'équipe LawRelay"
      direct_fees:
        title: "Honoraires"
        body: "Convenez des honoraires et facturez-vous directement. LawRelay ne gère pas les paiements et ne prend aucune commission."
      review_notice: "L'accès à la bêta est gratuit. LawRelay n'encaisse aucun frais de plateforme pendant cette bêta."
    privacy:
      meta_title: "Déclaration de confidentialité — LawRelay"
      eyebrow: "vie privée"
      title: "Confidentialité"
      introduction: "Quelles données nous utilisons et pourquoi."
      operator_contact_heading: "Contact"
      sections:
        controller:
          heading: "1. Qui est responsable du traitement"
          paragraphs:
            - "L'exploitant de LawRelay indiqué ci-dessus est responsable du traitement."
            - "Questions de confidentialité et demandes d’exercice de droits : privacy@lawrelay.be. Nous comparons votre nom et votre e-mail professionnel à advocaat.be et confirmons votre e-mail. Si l’adresse publiée est inaccessible, un administrateur peut examiner une autre adresse confirmée à l’aide de coordonnées professionnelles indépendantes."
        scope:
          heading: "2. Données traitées"
          bullets:
            - "Données de compte et de contact : nom, e-mail professionnel, langue préférée et traces d’authentification. Les demandes de changement d’adresse, décisions et notes de contrôle sont conservées avec votre profil professionnel."
            - "Si vous activez la double authentification, les clés d’authentification sont chiffrées et les codes de récupération sont hachés."
            - "À votre demande, nous reprenons votre nom, e-mail, langues et domaines juridiques publics sur advocaat.be pour préremplir l’inscription. L’aperçu est valable 20 minutes."
            - "Nous vérifions chaque jour votre profil advocaat.be et votre numéro d’entreprise dans la BCE. L’exploitant est averti si une entreprise est inactive ou si un profil a disparu ou changé."
            - "Données professionnelles et de facturation : profil officiel, nom et e-mail publiés, nom de l’entreprise, numéro d’entreprise/TVA, coordonnées et statut de vérification professionnelle. Si vous lancez vous-même une recherche via le registre public officiel de la BCE, nous conservons les données de facturation renvoyées (nom, numéro et, si disponible, adresse du siège) et la date des données de la BCE."
            - "Données de profil professionnel et de préférences de mise en relation, notamment les domaines de pratique, préférences de juridiction et—lorsque cela est pertinent pour les missions juridiques—langues parlées ; ainsi que données de mission, candidature, acceptation, annulation et audit."
            - "Données du destinataire de facturation par mission, notamment le nom professionnel et le numéro d’entreprise/TVA. Les membres vérifiés qui consultent la mission voient le nom et le numéro ; le cabinet du donneur d’ordre et le confrère choisi voient l’adresse et l’e-mail complets."
            - "Échanges avec l'assistance et données techniques ou de sécurité, comme l'adresse IP, l'identifiant de requête, l'appareil et les événements de sécurité."
            - "Uniquement pour les visites publiques non connectées : statistiques Umami sans cookies comprenant un chemin de page limité, l’origine du référent et des métadonnées ordinaires de la requête du navigateur. Nous n’envoyons ni données de compte, ni pages privées, ni formulaires, ni requêtes, ni données de mission."
            - "Pour les visiteurs anonymes hors de Belgique, un contrôle de sécurité local utilise l’adresse IP pour déterminer le pays et conserve brièvement une preuve de vérification."
          paragraphs:
            - "LawRelay n'est pas destiné aux noms de clients, faits du dossier, conclusions, preuves, documents ou communications couvertes par le secret professionnel. Ces informations doivent rester dans des systèmes contrôlés par les avocats concernés."
        purposes:
          heading: "3. Finalités et bases juridiques"
          bullets:
            - "Créer et sécuriser les comptes, vérifier l'accès et fournir la mise en relation : exécution du contrat de service."
            - "Prévenir les abus, sécuriser le service, assister les utilisateurs, améliorer la fiabilité et établir ou défendre des droits : intérêts légitimes mis en balance avec les droits des utilisateurs."
            - "Pour comprendre l’usage des pages publiques et améliorer le service : des statistiques agrégées limitées, sans cookies, sur la base de nos intérêts légitimes. Vous pouvez désactiver les statistiques dans le pied de page. Do Not Track et Global Privacy Control sont respectés."
        sharing:
          heading: "4. Destinataires"
          paragraphs:
            - "Les missions ouvertes sont visibles par les membres vérifiés. Les propositions sont visibles par l’avocat qui les soumet et le cabinet du donneur d’ordre. Après acceptation, le donneur d’ordre et l’avocat choisi reçoivent leurs adresses e-mail respectives."
            - "L’exploitant et les prestataires d’hébergement, d’e-mail et de sauvegarde ci-dessous traitent les données nécessaires au fonctionnement du service. Les données ne sont pas vendues."
        transfers:
          heading: "5. Lieu et transferts"
          paragraphs:
            - "Hetzner héberge l’application en Allemagne. Les sauvegardes chiffrées sont stockées dans AWS S3 à Francfort. Migadu, fournisseur suisse d’e-mail, indique que ses serveurs de messagerie sont situés en France."
            - "Les prestataires peuvent aussi traiter des données de compte et de support hors de l’EEE. La Suisse bénéficie d’une décision d’adéquation de l’UE ; l’accord de traitement des données d’AWS prévoit des clauses contractuelles types si nécessaire. Écrivez à privacy@lawrelay.be pour obtenir des précisions ou une copie des garanties."
        retention:
          heading: "6. Conservation"
          paragraphs:
            - "Le dernier contrôle reste lié à votre compte. Résumés des contrôles et alertes traitées : 90 jours. Les alertes ouvertes peuvent être conservées pour examen."
            - "Inscriptions inutilisées et non confirmées : 30 jours d’inactivité. Analyses des pages publiques : 90 jours. Notifications traitées : 90 jours après leur création ; celles en attente, en échec ou protégées peuvent être conservées pour examen. Missions et propositions clôturées : 2 ans après clôture. Demandes de confidentialité et signalements résolus : 2 ans après résolution. Échanges de support clôturés : 2 ans après clôture ou la dernière réponse, selon la date la plus tardive. Journaux d’audit : 1 an. Journaux techniques : 31 jours maximum."
            - "Les comptes restent jusqu’à leur clôture. Vous pouvez supprimer votre compte dans Profil après avoir confirmé votre mot de passe. Nous supprimons les données devenues inutiles. Les données de missions partagées peuvent rester pseudonymisées pendant 2 ans, ainsi qu’une trace minimale de suppression. Des missions en cours, enquêtes, litiges ou obligations légales peuvent justifier une conservation plus longue."
            - "Les sauvegardes sont conservées 30 jours. Des données supprimées peuvent rester temporairement dans des sauvegardes chiffrées ou versions de stockage, pendant environ 60 jours au maximum."
        rights:
          heading: "7. Vos droits"
          paragraphs:
            - "Selon la base juridique et les circonstances, vous pouvez demander l’accès, la rectification, l’effacement, la limitation ou la portabilité, ou vous opposer au traitement. Écrivez à privacy@lawrelay.be. Nous répondons normalement dans un mois ; si une prolongation légale est nécessaire, nous vous en informons dans ce même délai."
            - "Vous pouvez introduire une plainte auprès de l'Autorité de protection des données. LawRelay peut vérifier votre identité avant d'exécuter une demande."
        security:
          heading: "8. Sécurité, incidents et modifications"
          paragraphs:
            - "LawRelay utilise des contrôles d’accès, le chiffrement en transit, une authentification sûre, une journalisation limitée, des sauvegardes, une surveillance et des procédures d’incident. Aucun service en ligne ne peut promettre une sécurité absolue."
            - "Les modifications importantes seront datées et, le cas échéant, communiquées via le service ou par e-mail."
    terms:
      meta_title: "Conditions d'utilisation — LawRelay"
      eyebrow: "conditions d'utilisation"
      title: "Conditions"
      introduction: "Pour la bêta de LawRelay."
      operator_contact_heading: "Exploitant"
      sections:
        agreement:
          heading: "1. Contrat et exploitant"
          paragraphs:
            - "L'exploitant indiqué ci-dessus est votre cocontractant. Vous acceptez ces conditions lors de l'inscription."
        eligibility:
          heading: "2. Accès et vérification"
          paragraphs:
            - "L’inscription est ouverte aux avocats repris sur advocaat.be. L’accès exige la vérification du profil et de l’e-mail. Si l’adresse publiée est inaccessible, un administrateur examine votre identité et votre nouvelle adresse confirmée. Les utilisateurs actualisent leurs données professionnelles, protègent leur accès et signalent tout abus. La vérification n’est ni une recommandation ni une garantie de compétence."
        role:
          heading: "3. Rôle de LawRelay"
          paragraphs:
            - "LawRelay permet de publier des missions et de choisir parmi les réponses. Les avocats concluent leur collaboration entre eux ; LawRelay n’y est pas partie."
        professional_duties:
          heading: "4. Responsabilité professionnelle"
          bullets:
            - "Chaque avocat reste responsable du pouvoir de déléguer, des conflits d'intérêts, de l'indépendance, de la compétence, des délais, règles de procédure, du secret professionnel, de l'assurance, de la communication au client et des obligations du barreau."
            - "Une mise en relation ou un statut vérifié ne remplace jamais les vérifications propres de l'avocat."
            - "Les utilisateurs conviennent directement de l'étendue, des honoraires, de la facturation et de l'organisation pratique."
        content:
          heading: "5. Missions et contenu interdit"
          paragraphs:
            - "Les utilisateurs ne publient que des informations professionnelles exactes, nécessaires et qu'ils sont autorisés à partager. Identités des clients, faits du dossier, documents, preuves, communications confidentielles, contenu illicite, spam, demandes discriminatoires et annonces trompeuses sont interdits."
            - "LawRelay peut supprimer, restreindre ou conserver un contenu lorsque cela est raisonnablement nécessaire pour la sécurité, la conformité, un litige ou une obligation légale."
        workflow:
          heading: "6. Réponses et mises en relation"
          paragraphs:
            - "Le donneur d'ordre choisit qui contacter ou sélectionner. LawRelay ne garantit ni réponse, ni mise en relation, disponibilité, résultat, qualité ou paiement par un autre utilisateur. Les utilisateurs confirment chaque engagement et délai hors plateforme."
        beta_access:
          heading: "7. Bêta"
          paragraphs:
            - "LawRelay est en bêta. Les fonctionnalités peuvent évoluer."
        professional_fees:
          heading: "8. Honoraires professionnels"
          paragraphs:
            - "Les honoraires d'une mission sont convenus, facturés et payés directement entre avocats ou cabinets. LawRelay ne détient pas ces fonds, ne prélève pas de commission et ne garantit pas le paiement."
        moderation:
          heading: "9. Signalement, modération et suspension"
          paragraphs:
            - "Les utilisateurs peuvent signaler un contenu illicite, dangereux ou contraire aux règles à support@lawrelay.be. LawRelay peut enquêter, demander des informations, restreindre un contenu, suspendre l'accès ou fermer un compte de manière proportionnée."
            - "Pour contester une décision de modération, écrivez à support@lawrelay.be en indiquant la référence du compte ou de la mission. LawRelay l’examinera et répondra dans un délai raisonnable."
        intellectual_property:
          heading: "10. Propriété intellectuelle"
          paragraphs:
            - "Les utilisateurs conservent leurs droits sur leurs données privées et les contenus soumis et accordent à LawRelay une licence limitée pour les héberger, afficher, transmettre et traiter uniquement afin d'exploiter et de sécuriser le service. Le logiciel LawRelay est disponible sur GitHub sous la GNU Affero General Public License, version 3 ou ultérieure ; cette licence ne rend pas publiques les données privées des utilisateurs. LawRelay conserve les droits sur sa marque."
        availability:
          heading: "11. Disponibilité et modifications"
          paragraphs:
            - "LawRelay peut maintenir, mettre à jour ou modifier le service et ne promet pas une disponibilité ininterrompue. Les modifications importantes de la bêta seront, si possible, annoncées raisonnablement à l'avance."
        liability:
          heading: "12. Responsabilité, fin et droit applicable"
          paragraphs:
            - "Vous pouvez cesser d’utiliser la bêta et supprimer votre compte dans Profil après avoir confirmé votre mot de passe. LawRelay peut mettre fin à l’accès bêta avec un préavis raisonnable ou immédiatement si nécessaire pour la sécurité, la loi ou ces conditions."
            - "Le droit belge régit ces conditions. Les droits impératifs qui vous sont applicables restent préservés. Rien dans ces conditions n'exclut une responsabilité qui ne peut légalement l'être."
    cookies:
      meta_title: "Déclaration relative aux cookies — LawRelay"
      eyebrow: "cookies"
      title: "Cookies"
      introduction: "Uniquement les cookies nécessaires."
      sections:
        current_use:
          heading: "1. Ce qui est utilisé aujourd'hui"
          paragraphs:
            - "Des cookies nécessaires de session signée et de sécurité des formulaires maintiennent la connexion et protègent les formulaires contre les requêtes falsifiées. Une session de connexion dure au maximum 30 jours et prend fin plus tôt en cas de déconnexion, de réinitialisation du mot de passe ou de révocation de session. Pour un visiteur anonyme hors de Belgique, le contrôle de sécurité utilise un cookie de vérification signé pendant 24 heures et un cookie de retour pendant 10 minutes au plus. Le cookie de préférence Statistiques conserve votre réglage pendant 180 jours. Un cookie d’information distinct conserve pendant 180 jours la fermeture de la bannière d’information. Umami n’utilise lui-même aucun cookie."
        no_tracking:
          heading: "2. Analyses des pages publiques"
          paragraphs:
            - "LawRelay utilise Umami auto-hébergé pour des statistiques agrégées limitées, sans cookies, concernant les pages publiques non connectées. Il ne suit pas la publicité, ne crée pas de profils et n’enregistre pas les pages de compte, formulaires, requêtes de page ou données de mission. Utilisez Statistiques dans le pied de page pour désactiver ou réactiver les statistiques. Do Not Track et Global Privacy Control bloquent les statistiques."
        retention:
          heading: "3. Durée et contrôle"
          paragraphs:
            - "La technologie de session est limitée à la durée et aux besoins de sécurité du service. Vous pouvez supprimer les cookies dans le navigateur, mais le blocage des cookies nécessaires peut empêcher la connexion ou les formulaires de fonctionner."
        future:
          heading: "4. Si des cookies facultatifs sont ajoutés"
          paragraphs:
            - "LawRelay mettra cette déclaration à jour et demandera un consentement préalable et granulaire avant tout cookie non nécessaire. Refuser devra être aussi simple qu'accepter et le consentement restera révocable."
        contact:
          heading: "5. Questions"
          paragraphs:
            - "Les questions sur les cookies et la vie privée peuvent être envoyées au contact vie privée des mentions légales."
