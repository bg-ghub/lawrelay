      greater_than_or_equal_to: "moet groter dan of gelijk aan %{count} zijn"
      less_than_or_equal_to: "moet kleiner dan of gelijk aan %{count} zijn"
  activerecord:
    models:
      assignment: "opdracht"
      proposal: "voorstel"
    attributes:
      assignment:
        kind: "Type"
        title: "Titel"
        description: "Omschrijving"
        court: "Rechtbank"
        city: "Plaats"
        starts_at: "Datum en tijd"
        duration_minutes: "Geschatte duur"
        practice_area: "Rechtsdomein"
        fee_cents: "Richttarief"
        status: "Status"
        languages: "Taal"
      proposal:
        name: "Naam"
        email: "E-mailadres"
        rate_cents: "Tarief"
        message: "Toelichting"
