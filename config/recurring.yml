production:
  daily_registry_status:
    class: DailyRegistryStatusJob
    schedule: "0 5 * * * UTC"
  reconcile_registry_status:
    class: ReconcileRegistryStatusJob
    schedule: every 5 minutes
  purge_expired_sessions:
    command: "Session.where(expires_at: ..Time.current).delete_all"
    schedule: at 3:20am every day
  expire_stale_assignments:
    class: ExpireStaleAssignmentsJob
    schedule: every 5 minutes
  reconcile_notification_emails:
    class: ReconcileNotificationEmailsJob
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  retention_cleanup:
    class: RetentionCleanupJob
    schedule: at 3:45am every day
