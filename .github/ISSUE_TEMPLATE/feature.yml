name: Feature proposal
description: Propose a focused product or engineering improvement.
title: "[Feature]: "
labels: [ "enhancement" ]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user problem and the observable result, without real client or matter information.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, security, or professional-duty impact
      description: Note new data, permissions, retention, billing, or legal-workflow implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
