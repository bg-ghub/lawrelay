name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Semantic Version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "VERSION is not valid SemVer: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Scan Rails code
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Audit Ruby dependencies
        run: bin/bundler-audit check --update
      - name: Audit import-map dependencies
        run: bin/importmap audit
      - name: Test public analytics privacy boundary
        run: node --test script/ops/test-public-analytics.mjs
      - name: Check external probes and operational alerts without sending
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 script/ops/test-external-uptime.py
          python3 script/ops/test-mailbox-retention.py
          python3 script/ops/test-health-mail-retention.py
          sh script/ops/test-notify-no-send
          sh -n script/ops/lawrelay-backup
          sh -n script/ops/prepare-retention-host
          sh -n script/ops/install-mail-retention

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Cache RuboCop
        uses: actions/cache@v4
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}-
      - name: Check Ruby style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
    steps:
      - name: Install runtime packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test databases
        run: bin/rails db:test:prepare
      - name: Run Rails tests
        run: bin/rails test
      - name: Verify seed data
        run: bin/rails db:seed:replant

  system-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
    steps:
      - name: Install runtime packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare test databases
        run: bin/rails db:test:prepare
      - name: Run browser tests
        run: bin/rails test:system
      - name: Keep failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: system-test-screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ version, test ]
    steps:
      - uses: actions/checkout@v6
      - name: Build application image
        run: docker build --tag lawrelay-ci:${{ github.sha }} .
      - name: Render localized production pages and email in isolation
        env:
          IMAGE: lawrelay-ci:${{ github.sha }}
        run: |
          docker run --rm --network none \
            --env RAILS_ENV=production \
            --env SECRET_KEY_BASE_DUMMY=1 \
            --env APP_HOST=i18n.lawrelay.invalid \
            --env SOLID_QUEUE_IN_PUMA=false \
            --entrypoint /bin/sh "$IMAGE" \
            -c './bin/rails db:prepare >/dev/null && ./bin/rails runner script/ops/lawrelay-localization-smoke.rb'
      - name: Smoke-test production container
        env:
          IMAGE: lawrelay-ci:${{ github.sha }}
        run: |
          docker run --detach --rm --name lawrelay-ci --publish 3000:3000 \
            --env RAILS_ENV=production \
            --env SECRET_KEY_BASE_DUMMY=1 \
            --env APP_HOST=ci.lawrelay.invalid \
            --env SMTP_ADDRESS=smtp.migadu.com \
            --env SMTP_PORT=587 \
            --env SMTP_USERNAME=ci@lawrelay.invalid \
            --env SMTP_PASSWORD=dummy-ci-password \
            --env SMTP_SSL=false \
            --env SMTP_STARTTLS=true \
            --env SOLID_QUEUE_IN_PUMA=true \
            "$IMAGE"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --header 'Host: ci.lawrelay.invalid' http://127.0.0.1:3000/ready; then
              exit 0
            fi
            sleep 1
          done

          docker logs lawrelay-ci
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs lawrelay-ci || true
      - name: Stop smoke-test container
        if: always()
        run: docker stop lawrelay-ci || true
