# Optional overlay: use together with compose.production.yml after preparing and
# checking a Belgium graph locally. The engine is not reachable from the host or
# the public web. No addresses are sent to an external service.
services:
  app:
    volumes:
      - /var/lib/lawrelay-routing:/var/lib/lawrelay-routing:ro
    environment:
      LAWRELAY_OSM_INDEX_PATH: /var/lib/lawrelay-routing/addresses.sqlite3
      LAWRELAY_OSRM_URL: http://routing:5000
    networks:
      - routing-internal

  routing:
    image: ghcr.io/project-osrm/osrm-backend@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    container_name: lawrelay-routing
    command:
      - osrm-routed
      - /data/belgium-latest.osrm
      - --verbosity
      - ERROR
      - --algorithm
      - mld
      - --mmap
      - --threads
      - "1"
      - --max-viaroute-size
      - "3"
      - --max-table-size
      - "3"
      - --max-trip-size
      - "3"
      - --max-alternatives
      - "0"
    volumes:
      - /var/lib/lawrelay-routing:/data:ro
    environment:
      DISABLE_ACCESS_LOGGING: "1"
    networks:
      - routing-internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /nearest/v1/driving/4.35,50.85?number=1 HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; IFS= read -r line <&3; case \"$$line\" in *' 200 '*) exit 0;; *) exit 1;; esac"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: journald
      options:
        tag: lawrelay-routing

networks:
  routing-internal:
    internal: true
